<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lễ Thành Hầu Nguyễn Hữu Cảnh (1650–1700) | Bài Thuyết Trình Lịch Sử</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-lacquer: #070605;
      --gold-leaf: #d4af37;
      --parchment: #f5f0e6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-lacquer);
      color: var(--parchment);
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .font-serif-display {
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1.18;
      letter-spacing: -0.01em;
    }

    .museum-grid-bg {
      background-size: 72px 72px;
      background-image: 
        linear-gradient(to right, rgba(212, 175, 55, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(212, 175, 55, 0.035) 1px, transparent 1px);
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .drum-spin {
      animation: spinSlow 150s linear infinite;
    }

    /* HUD Visibility */
    #top-hud, #bottom-hud {
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
    }
    .hud-hidden-top {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .hud-hidden-bottom {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Navigation Dots */
    .nav-dot {
      height: 10px;
      width: 10px;
      border-radius: 9999px;
      background-color: #3a352f;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-dot:hover {
      background-color: #a8a29e;
    }
    .nav-dot.active {
      width: 38px;
      background-color: var(--gold-leaf);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.6);
    }

    /* View Transitions */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.55s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .stagger-item {
      opacity: 0;
      animation: revealUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lacquer-panel {
      background: linear-gradient(160deg, rgba(25, 21, 17, 0.96) 0%, rgba(10, 8, 7, 0.99) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.32);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.92);
    }

    .museum-card {
      position: relative;
      background: rgba(22, 18, 15, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.24);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill-active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.28), rgba(185, 28, 28, 0.22));
      border-color: #fbbf24 !important;
      box-shadow: 0 12px 34px -8px rgba(212, 175, 55, 0.45);
    }

    /* =========================================================================
       SLIDE 01: TƯỢNG ĐỒNG TRUNG TÂM & TIA CHỈ ĐIỂM TUẦN TỰ
       ========================================================================= */
    .statue-3d-rig {
      perspective: 1800px;
      transform-style: preserve-3d;
    }

    .statue-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform, opacity, filter;
      transition:
        transform 0.78s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.58s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .statue-layer.is-active {
      opacity: 1;
      z-index: 25;
      transform: translate3d(0, -10px, 0) scale(1.18) rotateY(0deg);
      filter: blur(0px) brightness(1.08) contrast(1.06) drop-shadow(0 30px 50px rgba(0,0,0,0.98));
    }

    .statue-layer.is-orbit-left {
      opacity: 0;
      z-index: 10;
      transform: translate3d(-165px, -10px, -260px) scale(0.92) rotateY(-55deg);
      filter: blur(12px) brightness(0.35);
    }

    .statue-layer.is-orbit-right {
      opacity: 0;
      z-index: 10;
      transform: translate3d(165px, -10px, -260px) scale(0.92) rotateY(55deg);
      filter: blur(12px) brightness(0.35);
    }

    .statue-hero-img {
      height: 550px;
      width: auto;
      max-width: none;
      object-fit: contain;
      object-position: center center;
      mix-blend-mode: lighten;
      -webkit-mask-image: radial-gradient(ellipse 92% 96% at 50% 52%, #000 86%, transparent 100%);
      mask-image: radial-gradient(ellipse 92% 96% at 50% 52%, #000 86%, transparent 100%);
    }

    @keyframes dotPopIn {
      0% { opacity: 0; transform: scale(0); }
      70% { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pulseRingOut {
      0% { opacity: 0; transform: scale(0.6); }
      30% { opacity: 0.95; }
      100% { opacity: 0; transform: scale(2.3); }
    }

    .seq-dot-origin {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: dotPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.28s forwards;
    }
    .seq-ring-origin {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: pulseRingOut 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.34s infinite;
    }

    .seq-line-seg1 {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: drawSegment 0.20s cubic-bezier(0.4, 0, 0.2, 1) 0.36s forwards;
    }

    .seq-dot-elbow {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: dotPopIn 0.20s cubic-bezier(0.34, 1.56, 0.64, 1) 0.54s forwards;
    }

    .seq-line-seg2 {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: drawSegment 0.18s cubic-bezier(0.16, 1, 0.3, 1) 0.56s forwards;
    }

    .seq-dot-end {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: dotPopIn 0.24s cubic-bezier(0.34, 1.56, 0.64, 1) 0.72s forwards;
    }

    @keyframes drawSegment {
      to { stroke-dashoffset: 0; }
    }

    @keyframes plaqueRevealLeft {
      0% { opacity: 0; transform: translateX(24px) scale(0.95); filter: blur(6px); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0px); }
    }
    @keyframes plaqueRevealRight {
      0% { opacity: 0; transform: translateX(-24px) scale(0.95); filter: blur(6px); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0px); }
    }
    .plaque-pop-left {
      opacity: 0;
      transform-origin: right center;
      animation: plaqueRevealLeft 0.46s cubic-bezier(0.16, 1, 0.3, 1) 0.72s forwards;
    }
    .plaque-pop-right {
      opacity: 0;
      transform-origin: left center;
      animation: plaqueRevealRight 0.46s cubic-bezier(0.16, 1, 0.3, 1) 0.72s forwards;
    }

    .editorial-plaque {
      position: relative;
      background: linear-gradient(155deg, rgba(22, 18, 14, 0.96) 0%, rgba(9, 8, 6, 0.98) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      box-shadow: 
        0 30px 70px -10px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(212, 175, 55, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
    }

    @keyframes counterFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .counter-balance-wing {
      opacity: 0;
      animation: counterFadeIn 0.6s ease 0.32s forwards;
    }

    /* =========================================================================
       TRANG KẾT THÚC HÀO HÙNG & TỰ HÀO (OUTRO CURTAIN)
       ========================================================================= */
    @keyframes floatParticle {
      0% { transform: translateY(30px) scale(0.8); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }
    .gold-sparkle {
      animation: floatParticle 5s ease-in-out infinite;
    }

    @keyframes dashMarch {
      to { stroke-dashoffset: -40; }
    }
    .march-route {
      stroke-dasharray: 8 6;
      animation: dashMarch 2.2s linear infinite;
    }

    @keyframes slowWave {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-14px) translateY(3px); }
    }
    .river-wave {
      animation: slowWave 9s ease-in-out infinite;
    }

    .vn-flag-badge {
      background: linear-gradient(135deg, #da251d 0%, #991b1b 100%);
      border: 1px solid rgba(253, 224, 71, 0.6);
    }

    /* =========================================================================
       MOBILE TOUCH NAVIGATION ZONES
       ========================================================================= */
    .touch-nav-zone {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 15;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-nav-zone-left {
      left: 0;
      width: 50%;
    }
    .touch-nav-zone-right {
      right: 0;
      width: 50%;
    }
    .touch-nav-zone .touch-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.5);
    }
    .touch-nav-zone-left .touch-feedback {
      left: 16px;
    }
    .touch-nav-zone-right .touch-feedback {
      right: 16px;
    }
    .touch-nav-zone:active .touch-feedback {
      opacity: 1;
    }
    .touch-feedback svg {
      width: 24px;
      height: 24px;
      color: #fde047;
    }

    /* =========================================================================
       LANDSCAPE ORIENTATION PROMPT
       ========================================================================= */
    #orientation-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(7, 6, 5, 0.97);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    #orientation-prompt .rotate-icon {
      width: 80px;
      height: 80px;
      color: #d4af37;
      animation: rotateHint 2s ease-in-out infinite;
    }
    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-90deg); }
      75% { transform: rotate(-90deg); }
    }

    /* =========================================================================
       FULLSCREEN PROMPT OVERLAY (mobile)
       ========================================================================= */
    #fullscreen-prompt {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      padding: 14px 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(185, 28, 28, 0.2));
      border: 1px solid rgba(212, 175, 55, 0.5);
      backdrop-filter: blur(16px);
      color: #fde68a;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      animation: pulseGlow 2s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
      50% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.45); }
    }

    /* =========================================================================
       MOBILE: SCALE ENTIRE PAGE TO FIT (like reveal.js)
       When on a small screen, we render at desktop resolution (1440×810)
       and CSS-transform scale the whole page down to fit the viewport.
       This preserves EXACTLY the desktop layout.
       ========================================================================= */
    body.mobile-scaled {
      width: 1440px;
      height: 810px;
      overflow: hidden;
      transform-origin: top left;
    }

    /* Small mobile portrait - show orientation prompt */
    @media (max-width: 600px) and (orientation: portrait) {
      #orientation-prompt {
        display: flex;
      }
    }

    /* Hide touch zones on desktop */
    @media (hover: hover) and (pointer: fine) {
      .touch-nav-zone {
        display: none;
      }
    }
  </style>
</head>
<body class="relative flex flex-col justify-between museum-grid-bg">

  <!-- Orientation Prompt (shown in portrait on phones) -->
  <div id="orientation-prompt">
    <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="4" y="2" width="16" height="20" rx="2" stroke-linecap="round"/>
      <path d="M20 8l2-2m0 0l2 2m-2-2v6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="font-family:'Be Vietnam Pro',sans-serif;">
      <div style="font-size:20px;font-weight:800;color:#fde047;margin-bottom:8px;">Xoay Ngang Điện Thoại</div>
      <div style="font-size:14px;color:#a8a29e;">Để xem bài thuyết trình tốt nhất,<br>hãy xoay điện thoại sang chế độ ngang</div>
    </div>
    <button onclick="this.parentElement.style.display='none'" style="margin-top:12px;padding:10px 24px;border-radius:12px;background:linear-gradient(135deg,#d4af37,#b91c1c);color:#070605;font-weight:800;font-size:13px;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:0.1em;">
      Bỏ Qua
    </button>
  </div>

  <!-- Fullscreen Prompt (shown on mobile when not fullscreen) -->
  <div id="fullscreen-prompt" onclick="enterMobileFullscreen()">
    ⛶ Nhấn để Toàn Màn Hình
  </div>

  <!-- Touch Navigation Zones (mobile only) -->
  <div class="touch-nav-zone touch-nav-zone-left" id="touch-zone-left" onclick="prevStep()">
    <div class="touch-feedback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
  </div>
  <div class="touch-nav-zone touch-nav-zone-right" id="touch-zone-right" onclick="nextStep()">
    <div class="touch-feedback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </div>


  <!-- Ambient Heritage Backdrop -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute inset-0"
         style="background: radial-gradient(circle at 50% 46%, rgba(212, 175, 55, 0.11), transparent 60%), radial-gradient(circle at 20% 80%, rgba(185, 28, 28, 0.07), transparent 50%);">
    </div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_25%,#070605_95%)]"></div>

    <svg class="drum-spin absolute -right-56 -bottom-56 w-[52rem] h-[52rem] opacity-[0.045] text-amber-400" viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="95" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="100" cy="100" r="78" stroke="currentColor" stroke-width="0.75"/>
      <circle cx="100" cy="100" r="58" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
      <circle cx="100" cy="100" r="35" stroke="currentColor" stroke-width="0.75"/>
      <polygon points="100,72 106,92 126,92 110,104 116,124 100,112 84,124 90,104 74,92 94,92" fill="currentColor"/>
    </svg>
  </div>

  <!-- Top HUD -->
  <header id="top-hud" class="hud-hidden-top relative z-30 w-full px-8 lg:px-14 py-3 flex items-center justify-between border-b border-amber-500/15 bg-stone-950/85 backdrop-blur-md">
    <div class="flex items-center gap-3.5">
      <div onclick="enterIntroScreen()" title="Về Sảnh Giới Thiệu Tổ" class="vn-flag-badge cursor-pointer w-10 h-9 rounded-lg flex items-center justify-center transition-transform hover:scale-105">
        <svg class="w-5 h-5" viewBox="0 0 30 20" fill="none">
          <polygon points="15,3.2 16.65,8.28 22,8.28 17.67,11.42 19.32,16.5 15,13.36 10.68,16.5 12.33,11.42 8,8.28 13.35,8.28" fill="#FFFF00"/>
        </svg>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs uppercase tracking-[0.22em] text-amber-400 font-bold">Lễ Thành Hầu Nguyễn Hữu Cảnh</span>
        <span class="hidden sm:inline-block text-xs px-2.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 font-semibold">1698 • Khởi nguyên Sài Gòn – TP.HCM</span>
      </div>
    </div>

    <nav id="slide-dots" class="flex items-center gap-2.5 bg-stone-900/90 px-4 py-2 rounded-full border border-stone-800"></nav>

    <div class="flex items-center gap-2 text-xs">
      <button onclick="enterIntroScreen()" class="px-4 py-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 border border-stone-700/80 text-stone-200 font-medium transition cursor-pointer">
        Tổ 2
      </button>
      <button onclick="toggleFullScreen()" class="px-4 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-200 font-medium transition cursor-pointer">
        ⛶ Toàn màn hình
      </button>
    </div>
  </header>

  <!-- Main Stage -->
  <main id="slide-stage" class="relative z-20 flex-1 w-full max-w-[1540px] mx-auto px-6 lg:px-12 flex items-center justify-center overflow-hidden -mt-2"></main>

  <!-- Hidden Speaker Notes (Press 'N') -->
  <aside id="speaker-notes-drawer" class="fixed bottom-16 left-8 right-8 max-w-4xl mx-auto z-40 hidden">
    <div class="lacquer-panel p-5 rounded-2xl border border-amber-400/50 shadow-2xl">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold uppercase tracking-widest text-amber-400">🎙️ Kịch bản lời nói chi tiết cho người thuyết trình</span>
        <button onclick="toggleSpeakerNotes()" class="text-xs text-stone-400 hover:text-white cursor-pointer">✕ Đóng</button>
      </div>
      <p id="speaker-notes-content" class="text-sm text-stone-200 leading-relaxed"></p>
    </div>
  </aside>

  <!-- Bottom HUD -->
  <footer id="bottom-hud" class="hud-hidden-bottom relative z-30 w-full px-8 lg:px-14 py-3 flex items-center justify-between border-t border-amber-500/15 bg-stone-950/85 backdrop-blur-md">
    <div class="flex items-center gap-4">
      <span id="slide-counter" class="font-serif-display text-2xl font-bold text-amber-400">01 / 06</span>
      <span id="slide-chapter" class="text-xs uppercase tracking-widest text-stone-300 border-l border-stone-700 pl-4 font-semibold"></span>
    </div>

    <div class="w-1/4 lg:w-1/3 h-1.5 bg-stone-800 rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-amber-500 via-amber-400 to-red-600 transition-all duration-500"></div>
    </div>

    <div class="flex items-center gap-2.5">
      <button onclick="prevStep()" class="px-4 py-2 rounded-lg bg-stone-900 hover:bg-stone-800 border border-stone-700 text-stone-300 text-xs font-semibold transition cursor-pointer">
        ← Trước
      </button>
      <button onclick="nextStep()" id="next-btn-label" class="px-5 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold text-xs transition shadow-lg shadow-amber-500/20 cursor-pointer">
        Tiếp theo →
      </button>
    </div>
  </footer>

  <script>

    let currentSlide = 0;

    const TEAM_MEMBERS = [

    const STATUE_ORBIT_ANGLES = [

    function updateSlide1OrbitSmoothly(nextSub) {
      const stageRoot = document.getElementById('s1-clean-stage');
      if (!stageRoot) {
        renderView(false);
        return;
      }

      const item = STATUE_ORBIT_ANGLES[nextSub];

      STATUE_ORBIT_ANGLES.forEach((_, idx) => {
        const layerEl = document.getElementById(`statue-layer-${idx}`);
        if (!layerEl) return;
        layerEl.classList.remove('is-active', 'is-orbit-left', 'is-orbit-right');

        if (idx === nextSub) {
          layerEl.classList.add('is-active');
        } else if (idx < nextSub) {
          layerEl.classList.add('is-orbit-left');
        } else {
          layerEl.classList.add('is-orbit-right');
        }
      });

      const floorRing = document.getElementById('s1-floor-ring');
      if (floorRing) {
        floorRing.style.transform = `rotateX(76deg) rotateZ(${item.ringRotate}deg)`;
      }

      document.querySelectorAll('.s1-step-btn').forEach((btn, idx) => {
        btn.classList.toggle('pill-active', idx === nextSub);
      });

      const rayBox = document.getElementById('s1-ray-box');
      const leftBox = document.getElementById('s1-left-box');
      const rightBox = document.getElementById('s1-right-box');

      if (rayBox) rayBox.innerHTML = buildSlide1SequentialRaySVG(item);
      if (leftBox) {
        leftBox.innerHTML = item.side === 'left' ? buildSlide1EditorialPlaque(item) : buildSlide1CounterBalance(item);
      }
      if (rightBox) {
        rightBox.innerHTML = item.side === 'right' ? buildSlide1EditorialPlaque(item) : buildSlide1CounterBalance(item);
      }
    }

      {
        chapter: "06 • Tổng Kết: Từ Danh Tướng Đến Tôn Thần Nam Bộ",
        subStepsCount: 1,
        speakerNotes: "Tổng kết 2 giá trị vĩnh cửu của Lễ Thành hầu Nguyễn Hữu Cảnh: Lúc sinh tiền ông là vị tướng mở cõi khai sinh Phủ Gia Định (1698) – tiền thân của Sài Gòn – TP.HCM. Sau khi mất, ông được thờ tại Thái miếu (1804) và hóa thân thành bậc Thượng Đẳng Tôn Thần trong hàng chục ngôi đền miếu khắp miền Nam.",
        render: () => `
          <div class="w-full space-y-8">
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 border-b border-amber-500/25 pb-5">
              <div>
                <span class="inline-block px-4 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-sm uppercase tracking-widest font-bold">

            </div>

            <div class="grid grid-cols-12 gap-8 items-stretch">
              <div class="col-span-12 lg:col-span-4 stagger-item lacquer-panel p-9 rounded-3xl border-t-4 border-t-amber-400 flex flex-col justify-between" style="animation-delay: 60ms">
                <div class="space-y-4">

                  <h3 class="font-serif-display text-4xl font-bold text-white leading-tight">Khai Sinh Đô Thị Sài Gòn</h3>

              <div class="col-span-12 lg:col-span-4 lacquer-panel p-9 rounded-3xl border border-amber-400/50 flex flex-col justify-between items-center text-center">
                <div class="text-sm uppercase tracking-[0.22em] text-amber-400 font-bold">
                  Biểu Tượng Vĩnh Cửu
                </div>

                <svg class="w-60 h-52 my-3" viewBox="0 0 220 180" fill="none">
                  <circle cx="110" cy="95" r="68" fill="rgba(212,175,55,0.1)" stroke="rgba(212,175,55,0.35)" stroke-dasharray="4 4"/>
                  <rect x="65" y="45" width="16" height="85" fill="rgba(255,255,255,0.08)" stroke="rgba(212,175,55,0.3)"/>
                  <path d="M98 30 L114 38 L114 130 L98 130 Z" fill="rgba(255,255,255,0.1)" stroke="rgba(212,175,55,0.4)"/>
                  <rect x="128" y="55" width="18" height="75" fill="rgba(255,255,255,0.08)" stroke="rgba(212,175,55,0.3)"/>
                  <path d="M30 115 Q110 75 190 115 L175 122 L45 122 Z" fill="#991b1b" stroke="#fbbf24" stroke-width="1.8"/>
                  <rect x="55" y="122" width="110" height="36" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5"/>
                  <rect x="96" y="132" width="28" height="26" fill="#7f1d1d" stroke="#fde047"/>
                </svg>

                <div>
                  <div class="font-serif-display text-4xl font-bold text-white">1698 – Nay</div>
                  <div class="text-lg text-amber-300 mt-1 font-medium">Di sản hơn 3 thế kỷ</div>
                </div>
              </div>

              <div class="col-span-12 lg:col-span-4 stagger-item pill-active lacquer-panel p-9 rounded-3xl border-t-4 border-t-red-500 flex flex-col justify-between" style="animation-delay: 160ms">
                <div class="space-y-4">
                  <span class="inline-block px-4 py-1.5 rounded-lg bg-red-500/20 text-red-300 text-sm font-bold uppercase tracking-wider">
                    02 • Trong Tâm Thức
                  </span>
                  <h3 class="font-serif-display text-4xl font-bold text-white leading-tight">Thượng Đẳng Tôn Thần</h3>
                  <p class="text-xl text-stone-200 leading-relaxed pt-2">
                    Thờ tại <strong>Thái miếu (1804)</strong> và hệ thống đền miếu khắp Nam Bộ suốt hơn 300 năm.
                  </p>
                </div>
                <div class="pt-6 border-t border-amber-500/20 text-lg text-amber-300 font-bold">
                  🙏 Tín ngưỡng thờ Lễ Thành Hầu
                </div>
              </div>
            </div>
          </div>
        `
      }
    ];

    function initDots() {
      const dotsContainer = document.getElementById('slide-dots');
      dotsContainer.innerHTML = slides.map((s, i) => `
        <button 
          onclick="goToSlide(${i})" 
          title="${s.chapter}" 
          class="nav-dot cursor-pointer ${i === currentSlide ? 'active' : ''}">
        </button>
      `).join('');
    }

    function updateDotsActiveState() {
      const dotButtons = document.querySelectorAll('#slide-dots .nav-dot');
      dotButtons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === currentSlide);
      });
    }

    function renderView(useMorph = true) {
      const stage = document.getElementById('slide-stage');
      const topHud = document.getElementById('top-hud');
      const bottomHud = document.getElementById('bottom-hud');
      const counter = document.getElementById('slide-counter');
      const chapter = document.getElementById('slide-chapter');
      const progress = document.getElementById('progress-bar');
      const notesContent = document.getElementById('speaker-notes-content');

      if (viewMode === 'deck') {
        topHud.classList.remove('hud-hidden-top');
        bottomHud.classList.remove('hud-hidden-bottom');
        updateDotsActiveState();
        counter.textContent = `0${currentSlide + 1} / 0${slides.length}`;
        chapter.textContent = slides[currentSlide].chapter;
        progress.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
        notesContent.textContent = slides[currentSlide].speakerNotes;
      } else {
        topHud.classList.add('hud-hidden-top');
        bottomHud.classList.add('hud-hidden-bottom');
        document.getElementById('speaker-notes-drawer').classList.add('hidden');
      }

      const updateStageDOM = () => {
        if (viewMode === 'intro') {
          stage.innerHTML = renderIntroPortal();
        } else if (viewMode === 'outro') {
          stage.innerHTML = renderOutroCurtain();
        } else {
          stage.innerHTML = slides[currentSlide].render(currentSubStep);
        }
      };

      if (useMorph && document.startViewTransition) {
        document.startViewTransition(() => updateStageDOM());
      } else {
        updateStageDOM();
      }
    }

    function enterIntroScreen() {
      viewMode = 'intro';
      renderView(true);
    }

    function startPresentationDeck() {
      viewMode = 'deck';
      currentSlide = 0;
      currentSubStep = 0;
      renderView(true);
    }

    function enterOutroScreen() {
      viewMode = 'outro';
      renderView(true);
    }

    function nextStep() {
      if (viewMode === 'intro') {
        startPresentationDeck();
        return;
      }
      if (viewMode === 'outro') {
        enterIntroScreen();
        return;
      }

      const maxSub = slides[currentSlide].subStepsCount || 1;
      if (currentSubStep < maxSub - 1) {
        currentSubStep++;
        if (currentSlide === 0) {
          updateSlide1OrbitSmoothly(currentSubStep);
        } else {
          renderView(true);
        }
      } else if (currentSlide < slides.length - 1) {
        currentSlide++;
        currentSubStep = 0;
        renderView(true);
      } else {
        enterOutroScreen();
      }
    }

    function prevStep() {
      if (viewMode === 'outro') {
        viewMode = 'deck';
        currentSlide = slides.length - 1;
        currentSubStep = (slides[currentSlide].subStepsCount || 1) - 1;
        renderView(true);
        return;
      }
      if (viewMode === 'intro') {
        return;
      }

      if (currentSubStep > 0) {
        currentSubStep--;
        if (currentSlide === 0) {
          updateSlide1OrbitSmoothly(currentSubStep);
        } else {
          renderView(true);
        }
      } else if (currentSlide > 0) {
        currentSlide--;
        currentSubStep = (slides[currentSlide].subStepsCount || 1) - 1;
        renderView(true);
      } else {
        enterIntroScreen();
      }
    }

    function goToSlide(idx) {
      viewMode = 'deck';
      currentSlide = idx;
      currentSubStep = 0;
      renderView(true);
    }

    function jumpToSubStep(subIdx) {
      if (subIdx === currentSubStep) return;
      currentSubStep = subIdx;
      if (viewMode === 'deck' && currentSlide === 0) {
        updateSlide1OrbitSmoothly(currentSubStep);
      } else {
        renderView(true);
      }
    }

    function toggleSpeakerNotes() {
      if (viewMode !== 'deck') return;
      document.getElementById('speaker-notes-drawer').classList.toggle('hidden');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextStep();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevStep();
      } else if (e.key.toLowerCase() === 'n') {
        toggleSpeakerNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      }
    });

    // =========================================================================
    // MOBILE OPTIMIZATIONS
    // =========================================================================

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const isMobileScreen = () => window.innerWidth <= 900;

    // Fullscreen prompt for mobile
    function showMobileFullscreenPrompt() {
      const prompt = document.getElementById('fullscreen-prompt');
      if (!prompt) return;
      if (isTouchDevice && !document.fullscreenElement) {
        prompt.style.display = 'block';
      } else {
        prompt.style.display = 'none';
      }
    }

    function enterMobileFullscreen() {
      const el = document.documentElement;
      const rFS = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (rFS) {
        rFS.call(el).then(() => {
          // Lock to landscape if supported
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(() => {});
      }
      const prompt = document.getElementById('fullscreen-prompt');
      if (prompt) prompt.style.display = 'none';
    }

    // Listen for fullscreen changes
    document.addEventListener('fullscreenchange', showMobileFullscreenPrompt);
    document.addEventListener('webkitfullscreenchange', showMobileFullscreenPrompt);

    // =========================================================================
    // WHOLE-PAGE SCALE (reveal.js approach)
    // Render at fixed desktop resolution 1440×810, then scale to fit viewport.
    // This guarantees the phone view is pixel-identical to the desktop view.
    // =========================================================================
    const DESIGN_W = 1440;
    const DESIGN_H = 810;

    function autoScaleMobile() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Only apply scaling on touch devices or small screens
      if (isTouchDevice || vw < DESIGN_W || vh < DESIGN_H) {
        const scaleX = vw / DESIGN_W;
        const scaleY = vh / DESIGN_H;
        const scale = Math.min(scaleX, scaleY);

        if (scale < 0.98) {
          document.body.classList.add('mobile-scaled');
          document.body.style.transform = `scale(${scale})`;
          document.body.style.transformOrigin = 'top left';
          document.body.style.width = DESIGN_W + 'px';
          document.body.style.height = DESIGN_H + 'px';
        } else {
          resetScale();
        }
      } else {
        resetScale();
      }
    }

    function resetScale() {
      document.body.classList.remove('mobile-scaled');
      document.body.style.transform = '';
      document.body.style.transformOrigin = '';
      document.body.style.width = '';
      document.body.style.height = '';
    }

    // Prevent accidental zoom on double-tap
    if (isTouchDevice) {
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }

    // Handle orientation change
    window.addEventListener('resize', () => {
      autoScaleMobile();
      showMobileFullscreenPrompt();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        autoScaleMobile();
        // Hide orientation prompt when landscape
        const prompt = document.getElementById('orientation-prompt');
        if (prompt && window.innerWidth > window.innerHeight) {
          prompt.style.display = 'none';
        }
      }, 300);
    });

    // Prevent pull-to-refresh on mobile
    document.body.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) return;
      e.preventDefault();
    }, { passive: false });

    // Swipe gesture support
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      const dt = Date.now() - touchStartTime;

      // Only handle horizontal swipes (min 60px, within 400ms, mostly horizontal)
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 400) {
        if (dx < 0) {
          nextStep();
        } else {
          prevStep();
        }
      }
    }, { passive: true });

    initDots();
    renderView(false);
    showMobileFullscreenPrompt();
    autoScaleMobile();
  </script>
